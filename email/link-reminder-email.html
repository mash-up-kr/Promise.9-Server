<!doctype html>
<html lang="ko">
<head>
  <!--
    Template inputs:
      {{linkTitle}}    저장된 링크 제목
      {{linkUrl}}      사용자가 열 실제 HTTPS URL
      {{motionGifUrl}} 공개 HTTPS GIF URL

    Required multipart/related attachment:
      Content-ID: <link-reminder-poster>
      Content-Type: image/png
      Source file: assets/link-reminder-motion-poster.png
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>저장해둔 링크 지금 볼까요?</title>
  <style>
    .link-card:hover { border-color:#c7bf91 !important; }
    .link-card-link:hover .link-arrow { background-color:#f5f2e8 !important; transform:translateX(2px); }
    @media only screen and (max-width: 620px) {
      .email-shell { width: 100% !important; }
      .email-padding { padding-left: 24px !important; padding-right: 24px !important; }
      .hero-space { height: 270px !important; }
      .headline { font-size: 34px !important; line-height: 42px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#050507; color:#f5f2e8;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
    나중에 보려고 남겨둔 링크를 다시 꺼내왔어요.
  </div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background-color:#050507; border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" class="email-shell" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px; max-width:600px; background-color:#111116; border-collapse:separate; border-spacing:0; border-radius:28px; overflow:hidden;">
          <tr>
            <td
              class="email-background"
              align="center"
              valign="top"
              width="600"
              height="720"
              background="cid:link-reminder-poster"
              style="width:600px; height:720px; background-color:#111116; background-image:url('{{motionGifUrl}}'),url('cid:link-reminder-poster'); background-position:top center,top center; background-repeat:no-repeat,no-repeat; background-size:600px 720px,600px 720px;"
            >
              <!--[if mso]>
              <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;height:720px;">
                <v:fill type="frame" src="cid:link-reminder-poster" color="#111116" />
                <v:textbox inset="0,0,0,0">
              <![endif]-->

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; border-collapse:collapse;">
                <tr>
                  <td class="hero-space" height="315" style="height:315px; font-size:0; line-height:0;">&nbsp;</td>
                </tr>
                <tr>
                  <td class="email-padding" align="center" style="padding:22px 64px 50px; font-family:'Pretendard',sans-serif;">
                    <h1 class="headline" style="margin:0; color:#f5f2e8; font-family:'Pretendard',sans-serif; font-size:44px; line-height:54px; font-weight:700; letter-spacing:-1.6px; text-align:center; text-shadow:0 2px 14px #111116;">
                      저장해둔 링크<br>지금 볼까요?
                    </h1>

                    <p style="margin:20px 0 30px; color:#d0cec4; font-size:15px; line-height:26px; text-align:center; text-shadow:0 1px 8px #111116;">
                      나중에 보려고 남겨둔 링크를 다시 꺼내왔어요.
                    </p>

                    <table class="link-card" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#24231f" style="width:100%; cursor:pointer; border:1px solid #66665f; border-collapse:separate; border-spacing:0; border-radius:18px; background-color:rgba(28,29,31,.54); background-image:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.012)); box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 14px 32px rgba(0,0,0,.28);">
                      <tr>
                        <td align="left" style="padding:0; font-family:'Pretendard',sans-serif;">
                          <a class="link-card-link" href="{{linkUrl}}" aria-label="{{linkTitle}} 링크 열기" style="display:block; cursor:pointer; padding:20px 22px; color:#f5f2e8; text-decoration:none;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; border-collapse:collapse;">
                              <tr>
                                <td valign="middle" style="padding:0 14px 0 0; color:#f5f2e8; font-family:'Pretendard',sans-serif; font-size:18px; line-height:27px; font-weight:700;">
                                  {{linkTitle}}
                                </td>
                                <td width="36" valign="middle" align="right" style="width:36px; padding:0;">
                                  <span class="link-arrow" style="display:inline-block; width:34px; height:34px; border:1px solid #eee9ca; border-radius:18px; background-color:#ded9b8; color:#282722; font-family:'Pretendard',sans-serif; font-size:27px; line-height:31px; font-weight:500; text-align:center; mso-line-height-rule:exactly; transition:background-color .18s ease,transform .18s ease;">›</span>
                                </td>
                              </tr>
                            </table>
                          </a>
                        </td>
                      </tr>
                    </table>

                    <p style="margin:28px 0 0; color:#88867d; font-family:'Pretendard',sans-serif; font-size:11px; line-height:18px; text-align:center;">
                      직접 저장한 링크를 다시 알려드리는 리마인드 메일입니다.<br>
                      링크가 열리지 않으면 Promise.9에서 확인해주세요.
                    </p>
                  </td>
                </tr>
              </table>

              <!--[if mso]>
                </v:textbox>
              </v:rect>
              <![endif]-->
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
