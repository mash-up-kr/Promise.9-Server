<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>저장해둔 링크 지금 볼까요?</title>
  <style>
    :root { color-scheme:light dark; supported-color-schemes:light dark; }
    table { mso-table-lspace:0; mso-table-rspace:0; }
    a { text-decoration:none; }
    .dark-image { display:none; mso-hide:all; }
    @media (prefers-color-scheme: dark) {
      body, .email-bg { background-color:#1a1a1a !important; }
      .primary-text { color:#ffffff !important; }
      .secondary-text { color:#b5b5b5 !important; }
      .separator { border-color:#313131 !important; }
      .note-box { background-color:#2f2f33 !important; }
      .empty-note { color:#646466 !important; }
      .footer-text { color:#8a8a93 !important; }
      .source-button { background-color:#fafafa !important; border-color:#fafafa !important; }
      .folder-chip { background-color:{{folderDarkBg}} !important; color:{{folderDarkText}} !important; }
      .light-image { display:none !important; }
      .dark-image { display:inline !important; }
    }
    @media only screen and (max-width:480px) {
      .main-padding { padding-left:16px !important; padding-right:16px !important; }
      .title { font-size:28px !important; line-height:37px !important; }
      .metadata-cell, .web-actions { display:block !important; width:100% !important; }
      .web-actions { padding-top:12px !important; text-align:left !important; }
      .cta-cell { display:block !important; width:100% !important; }
      .cta-gap { display:block !important; height:8px !important; width:100% !important; }
      .footer-space { height:64px !important; }
    }
  </style>
</head>
<body class="email-bg" style="margin:0; padding:0; background-color:#ffffff; color:#1a1a1a; font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">저장하신 링크의 리마인드 날짜가 되었어요. {{linkTitle}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="email-bg" style="width:100%; background-color:#ffffff;">
    <tr><td align="center">
      <!--[if mso]><table role="presentation" width="481" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="481" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:481px; table-layout:fixed;">
        <tr><td><a href="https://link-ding-dong.com" style="display:block;"><img src="cid:reminder-banner" width="481" height="114" alt="띵동! LINK DING DONG — Reminder link for you" style="display:block; width:100%; max-width:481px; height:auto; border:0; border-radius:8px;"></a></td></tr>
        <tr><td class="main-padding" style="padding:40px 20px 20px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; table-layout:fixed;">
            <tr><td class="primary-text" style="font-size:16px; line-height:21px; font-weight:600; letter-spacing:-.27px; color:#1a1a1a;"><img src="cid:reminder-bell" width="20" height="20" alt="" style="display:inline-block; width:20px; height:20px; vertical-align:middle; border:0;"><span style="display:inline-block; padding-top:4px; vertical-align:middle; margin-left:6px;">{{reminderDate}}</span></td></tr>
            <tr><td style="padding-top:8px;"><h1 class="title primary-text" style="margin:0; font-size:32px; line-height:42px; font-weight:600; letter-spacing:-.27px; color:#1a1a1a; overflow-wrap:anywhere; word-break:keep-all;">{{linkTitle}}</h1></td></tr>
            <tr><td style="padding-top:12px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="separator" style="width:100%; table-layout:fixed; border-top:1px solid #e5e5e5; border-bottom:1px solid #e5e5e5;">
                <tr>
                  <td class="metadata-cell" valign="middle" style="padding:10px 0; overflow-wrap:anywhere; word-break:break-word;">
                    <span class="folder-chip" style="display:inline-block; max-width:100%; box-sizing:border-box; padding:5px 8px; border-radius:8px; background-color:{{folderLightBg}}; color:{{folderLightText}}; font-size:13px; line-height:16px; font-weight:600; vertical-align:middle;"><span class="light-image"><img src="cid:reminder-folder-light-{{folderColorIndex}}" width="14" height="14" alt="" style="display:inline-block; width:14px; height:14px; vertical-align:middle; border:0;"></span><!--[if !mso]><!--><span class="dark-image" style="display:none; mso-hide:all;"><img src="cid:reminder-folder-dark-{{folderColorIndex}}" width="14" height="14" alt="" style="display:inline-block; width:14px; height:14px; vertical-align:middle; border:0;"></span><!--<![endif]--><span style="display:inline-block; padding-top:2px; padding-left:4px; vertical-align:middle;">{{folderName}}</span></span>
                    <span class="secondary-text" style="display:{{domainDisplay}}; margin-left:8px; margin-top:{{domainMargin}}px; font-size:13px; line-height:18px; color:#5f5f5f; vertical-align:middle;"> <a href="{{linkUrl}}" class="secondary-text" style="color:#5f5f5f; text-decoration:underline;">{{domain}}</a> · {{savedDate}} 저장</span>
                  </td>
                  <td class="web-actions" width="175" align="right" valign="middle" style="width:175px; padding:10px 0;">
                    <table role="presentation" align="right" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;"><tr>
                      <td width="36" valign="middle" style="width:36px; padding:0;"><a href="{{detailUrl}}" aria-label="링띵동에서 즐겨찾기 확인" style="display:inline-block; width:36px; height:36px; vertical-align:middle;"><span class="light-image"><img src="cid:reminder-star-light" width="36" height="36" alt="" style="display:inline-block; width:36px; height:36px; vertical-align:middle; border:0;"></span><!--[if !mso]><!--><span class="dark-image" style="display:none; mso-hide:all;"><img src="cid:reminder-star-dark" width="36" height="36" alt="" style="display:inline-block; width:36px; height:36px; vertical-align:middle; border:0;"></span><!--<![endif]--></a></td>
                      <td width="8" style="width:8px; padding:0; font-size:0; line-height:0;">&nbsp;</td>
                      <td valign="middle" style="padding:0;"><table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;"><tr><td height="34" align="center" valign="middle" style="height:34px; padding:0; border:1px solid #9e9ea5; border-radius:100px; vertical-align:middle;"><a href="{{detailUrl}}" class="primary-text" style="display:block; padding:0 11px; color:#1a1a1a; font-size:13px; line-height:34px; mso-line-height-rule:exactly; font-weight:600; text-decoration:none; white-space:nowrap;"><span style="display:inline-block; padding-top:2px; line-height:18px; vertical-align:middle;">링띵동에서 보기</span>&nbsp;<span class="light-image"><img src="cid:reminder-arrow-light" width="16" height="16" alt="" style="display:inline-block; width:16px; height:16px; vertical-align:middle; border:0;"></span><!--[if !mso]><!--><span class="dark-image" style="display:none; mso-hide:all;"><img src="cid:reminder-arrow-dark" width="16" height="16" alt="" style="display:inline-block; width:16px; height:16px; vertical-align:middle; border:0;"></span><!--<![endif]--></a></td></tr></table></td>
                    </tr></table>
                  </td>
                </tr>
              </table>
            </td></tr>
            <tr><td style="padding-top:20px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>
                <td class="primary-text" style="color:#1a1a1a; font-size:16px; line-height:26px; font-weight:600;">나의 메모</td>
                <td align="right"><a href="{{detailUrl}}" class="primary-text" style="display:{{memoActionDisplay}}; color:#1a1a1a; font-size:13px; line-height:24px; font-weight:600;">메모 작성하기 <span class="light-image"><img src="cid:reminder-chevron-light" width="16" height="16" alt="" style="display:inline-block; width:16px; height:16px; vertical-align:middle; border:0;"></span><!--[if !mso]><!--><span class="dark-image" style="display:none; mso-hide:all;"><img src="cid:reminder-chevron-dark" width="16" height="16" alt="" style="display:inline-block; width:16px; height:16px; vertical-align:middle; border:0;"></span><!--<![endif]--></a></td>
              </tr></table>
            </td></tr>
            <tr><td style="padding-top:8px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="table-layout:fixed; width:100%;"><tr><td class="note-box" valign="top" height="40" style="height:40px; padding:16px; border-radius:20px; background-color:#e9e9eb;"><p class="{{memoClass}}" style="margin:0; color:{{memoColor}}; font-size:14px; line-height:20px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word;">{{memo}}</p></td></tr></table>
            </td></tr>
            <tr><td style="padding-top:20px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; table-layout:fixed;"><tr>
                <td class="cta-cell" align="center"><a href="{{linkUrl}}" class="source-button" style="display:block; box-sizing:border-box; height:48px; padding:0 4px; border:1px solid #d9d9d9; border-radius:100px; background-color:#ffffff; color:#242426; font-size:16px; line-height:24px; font-weight:600; white-space:nowrap;"><table role="presentation" align="center" height="46" cellspacing="0" cellpadding="0" border="0" style="height:46px; margin:0 auto; border-collapse:collapse;"><tr><td width="20" valign="middle" style="width:20px; padding:0 6px 0 0; font-size:0; line-height:0;"><img src="cid:reminder-source" width="20" height="20" alt="" style="display:block; width:20px; height:20px; border:0;"></td><td valign="middle" style="padding:4px 0 0; color:#242426; font-size:16px; line-height:24px; font-weight:600; white-space:nowrap;">원문 보러 가기</td></tr></table></a></td>
                <td class="cta-gap" width="8" style="width:8px; font-size:0;">&nbsp;</td>
                <td class="cta-cell" align="center"><a href="{{detailUrl}}" style="display:block; box-sizing:border-box; height:48px; padding:0 4px; border-radius:100px; background-color:#fffe66; color:#242426; font-size:16px; line-height:24px; font-weight:600; white-space:nowrap;"><table role="presentation" align="center" height="48" cellspacing="0" cellpadding="0" border="0" style="height:48px; margin:0 auto; border-collapse:collapse;"><tr><td width="20" valign="middle" style="width:20px; padding:0 6px 0 0; font-size:0; line-height:0;"><img src="cid:reminder-ai" width="20" height="20" alt="" style="display:block; width:20px; height:20px; border:0;"></td><td valign="middle" style="padding:4px 0 0; color:#242426; font-size:16px; line-height:24px; font-weight:600; white-space:nowrap;">AI 요약 함께 보기</td></tr></table></a></td>
              </tr></table>
            </td></tr>
            <tr><td class="footer-space" height="80" style="height:80px; font-size:0; line-height:0;">&nbsp;</td></tr>
            <tr><td><span class="light-image"><img src="cid:reminder-logo-light" width="60" height="51" alt="" style="display:inline-block; width:60px; height:51px; vertical-align:middle; border:0;"></span><!--[if !mso]><!--><span class="dark-image" style="display:none; mso-hide:all;"><img src="cid:reminder-logo-dark" width="60" height="51" alt="" style="display:inline-block; width:60px; height:51px; vertical-align:middle; border:0;"></span><!--<![endif]--></td></tr>
            <tr><td class="footer-text" style="padding-top:12px; color:#59595e; font-size:13px; line-height:18px; letter-spacing:-.27px;">© {{copyrightYear}} LINK DING DONG<br>이 메일은 저장하신 링크의 리마인드 날짜가 되어 보내드렸어요.</td></tr>
            <tr><td class="footer-text" style="padding-top:12px; color:#59595e; font-size:13px; line-height:18px;">[문의]<br><a href="mailto:promise.9@gmail.com" style="color:#0093ff; text-decoration:underline;">promise.9@gmail.com</a></td></tr>
          </table>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
