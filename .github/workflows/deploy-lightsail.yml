name: Deploy To Lightsail

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    concurrency:
      group: deploy-lightsail
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_REPOSITORY:?DOCKERHUB_REPOSITORY is required}"
          IMAGE_NAME="$(printf '%s/%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (production runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test -- --runInBand

      - name: Build and verify OTLP
        run: bun run test:observability

      - name: Validate host metrics configuration
        run: bash script/check-alloy-config.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Create production env file
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TINY_FISH_API_KEY: ${{ secrets.TINY_FISH_API_KEY }}
          TINY_FISH_API_KEYS: ${{ secrets.TINY_FISH_API_KEYS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MASTER_ACCESS_TOKEN: ${{ secrets.MASTER_ACCESS_TOKEN }}
          MASTER_USER_ID: ${{ secrets.MASTER_USER_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SQS_LINK_ANALYSIS_QUEUE_URL: ${{ secrets.SQS_LINK_ANALYSIS_QUEUE_URL }}
          EMAIL_ASSET_BASE_URL: ${{ vars.EMAIL_ASSET_BASE_URL }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED || 'false' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_HOST_ID: ${{ vars.OTEL_HOST_ID }}
          OTEL_TRACES_SAMPLER_ARG: ${{ vars.OTEL_TRACES_SAMPLER_ARG || '1' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
        run: |
          : "${DATABASE_URL_PRODUCTION:?DATABASE_URL_PRODUCTION is required}"
          : "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
          : "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
          : "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}"
          : "${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}"
          : "${KAKAO_NATIVE_APP_KEY:?KAKAO_NATIVE_APP_KEY is required}"
          : "${APPLE_CLIENT_ID:?APPLE_CLIENT_ID is required}"
          : "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
          : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
          : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
          : "${SQS_LINK_ANALYSIS_QUEUE_URL:?SQS_LINK_ANALYSIS_QUEUE_URL is required}"
          : "${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}"
          if [ -z "$TINY_FISH_API_KEYS" ] && [ -z "$TINY_FISH_API_KEY" ]; then
            echo "TINY_FISH_API_KEYS or TINY_FISH_API_KEY is required" >&2
            exit 1
          fi

          if [ "$OTEL_ENABLED" = 'true' ]; then
            : "${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required when OTEL_ENABLED=true}"
            : "${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS is required when OTEL_ENABLED=true}"
            : "${OTEL_HOST_ID:?OTEL_HOST_ID must identify the Lightsail host when OTEL_ENABLED=true}"
          fi

          umask 077
          {
            printf 'APP_ENV=production\n'
            printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
            printf 'OTEL_ENABLED=%s\n' "$OTEL_ENABLED"
            if [ "$OTEL_ENABLED" = 'true' ]; then
              printf 'OTEL_EXPORTER_OTLP_ENDPOINT=%s\n' "$OTEL_EXPORTER_OTLP_ENDPOINT"
              printf 'OTEL_EXPORTER_OTLP_HEADERS=%s\n' "$OTEL_EXPORTER_OTLP_HEADERS"
              printf 'OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf\n'
              printf 'OTEL_SERVICE_NAME=promise9-api\n'
              printf 'OTEL_SERVICE_VERSION=%s\n' "$GITHUB_SHA"
              printf 'OTEL_HOST_ID=%s\n' "$OTEL_HOST_ID"
              printf 'OTEL_TRACES_SAMPLER_ARG=%s\n' "$OTEL_TRACES_SAMPLER_ARG"
            fi
            printf 'DATABASE_URL_PRODUCTION=%s\n' "$DATABASE_URL_PRODUCTION"
            printf 'JWT_ACCESS_SECRET=%s\n' "$JWT_ACCESS_SECRET"
            printf 'JWT_REFRESH_SECRET=%s\n' "$JWT_REFRESH_SECRET"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'KAKAO_CLIENT_ID=%s\n' "$KAKAO_CLIENT_ID"
            printf 'KAKAO_NATIVE_APP_KEY=%s\n' "$KAKAO_NATIVE_APP_KEY"
            printf 'APPLE_CLIENT_ID=%s\n' "$APPLE_CLIENT_ID"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            if [ -n "$TINY_FISH_API_KEYS" ]; then
              printf 'TINY_FISH_API_KEYS=%s\n' "$TINY_FISH_API_KEYS"
            else
              printf 'TINY_FISH_API_KEY=%s\n' "$TINY_FISH_API_KEY"
            fi

            if [ -n "$YOUTUBE_API_KEY" ]; then
              printf 'YOUTUBE_API_KEY=%s\n' "$YOUTUBE_API_KEY"
            fi

            if [ -n "$KAKAO_CLIENT_SECRET" ]; then
              printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_CLIENT_SECRET"
            fi

            if [ -n "$MASTER_ACCESS_TOKEN" ]; then
              printf 'MASTER_ACCESS_TOKEN=%s\n' "$MASTER_ACCESS_TOKEN"
            fi

            if [ -n "$MASTER_USER_ID" ]; then
              printf 'MASTER_USER_ID=%s\n' "$MASTER_USER_ID"
            fi

            # 빈 값을 쓰면 URL 검증에 실패해 부팅이 막히므로 설정된 항목만 내려보낸다.
            if [ -n "$AWS_REGION" ]; then
              printf 'AWS_REGION=%s\n' "$AWS_REGION"
            fi
            printf 'SQS_LINK_ANALYSIS_QUEUE_URL=%s\n' "$SQS_LINK_ANALYSIS_QUEUE_URL"
            printf 'SQS_CONSUMER_ENABLED=true\n'

            printf 'EMAIL_SES_REGION=ap-northeast-2\n'

            if [ -n "$EMAIL_ASSET_BASE_URL" ]; then
              printf 'EMAIL_ASSET_BASE_URL=%s\n' "$EMAIL_ASSET_BASE_URL"
            fi
            printf 'EMAIL_FROM_ADDRESS=%s\n' "$EMAIL_FROM_ADDRESS"
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY"
            if [ -n "$AWS_SESSION_TOKEN" ]; then
              printf 'AWS_SESSION_TOKEN=%s\n' "$AWS_SESSION_TOKEN"
            fi
          } > .env.production

      - name: Create host metrics env file
        if: vars.HOST_METRICS_ENABLED == 'true'
        env:
          OTEL_HOST_ID: ${{ vars.OTEL_HOST_ID }}
          GRAFANA_CLOUD_METRICS_URL: ${{ vars.GRAFANA_CLOUD_METRICS_URL }}
          GRAFANA_CLOUD_METRICS_USER: ${{ vars.GRAFANA_CLOUD_METRICS_USER }}
          GRAFANA_CLOUD_METRICS_TOKEN: ${{ secrets.GRAFANA_CLOUD_METRICS_TOKEN }}
        run: |
          : "${OTEL_HOST_ID:?OTEL_HOST_ID is required}"
          : "${GRAFANA_CLOUD_METRICS_URL:?GRAFANA_CLOUD_METRICS_URL is required}"
          : "${GRAFANA_CLOUD_METRICS_USER:?GRAFANA_CLOUD_METRICS_USER is required}"
          : "${GRAFANA_CLOUD_METRICS_TOKEN:?GRAFANA_CLOUD_METRICS_TOKEN is required}"
          umask 077
          {
            printf 'OTEL_HOST_ID=%s\n' "$OTEL_HOST_ID"
            printf 'GRAFANA_CLOUD_METRICS_URL=%s\n' "$GRAFANA_CLOUD_METRICS_URL"
            printf 'GRAFANA_CLOUD_METRICS_USER=%s\n' "$GRAFANA_CLOUD_METRICS_USER"
            printf 'GRAFANA_CLOUD_METRICS_TOKEN=%s\n' "$GRAFANA_CLOUD_METRICS_TOKEN"
          } > .env.alloy.production

      - name: Ensure deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || '22' }}
          script_stop: true
          script: |
            sudo mkdir -p /opt/promise9
            sudo chown "$USER:$USER" /opt/promise9

      - name: Upload runtime files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || '22' }}
          source: docker-compose.prod.yml,.env.production
          target: /opt/promise9
          overwrite: true

      - name: Upload host metrics files
        if: vars.HOST_METRICS_ENABLED == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || '22' }}
          source: docker-compose.observability.yml,deploy/observability/config.alloy,.env.alloy.production
          target: /opt/promise9
          overwrite: true

      - name: Deploy host metrics collector
        if: vars.HOST_METRICS_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || '22' }}
          script_stop: true
          script: |
            set -eu
            cd /opt/promise9
            mv .env.alloy.production .env.alloy
            chmod 600 .env.alloy
            docker compose -f docker-compose.observability.yml pull alloy
            docker compose -f docker-compose.observability.yml run --rm --no-deps alloy validate /etc/alloy/config.alloy
            # bind mount의 파일 내용 변경은 Compose가 감지하지 않으므로 설정을 다시 읽게 한다.
            docker compose -f docker-compose.observability.yml up -d --force-recreate alloy
            for attempt in $(seq 1 15); do
              if curl --fail --silent --max-time 2 http://127.0.0.1:12345/-/ready > /dev/null; then
                exit 0
              fi
              sleep 2
            done
            echo 'Alloy readiness check failed' >&2
            exit 1

      - name: Deploy container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || '22' }}
          script_stop: true
          script: |
            set -eu
            cd /opt/promise9
            if [ '${{ vars.HOST_METRICS_ENABLED || 'false' }}' != 'true' ] && docker container inspect promise9-alloy > /dev/null 2>&1; then
              docker stop --time 30 promise9-alloy
            fi
            mv .env.production .env
            chmod 600 .env
            APP_IMAGE="${{ steps.image.outputs.name }}:${{ github.sha }}" docker compose -f docker-compose.prod.yml pull api
            APP_IMAGE="${{ steps.image.outputs.name }}:${{ github.sha }}" docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 120 api
            docker image prune -af --filter "until=72h"
