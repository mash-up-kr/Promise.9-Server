name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (production runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test -- --runInBand

      - name: Infrastructure check
        run: |
          bun run infra:typecheck
          bun run infra:synth --quiet --no-notices

      - name: Build and verify OTLP
        run: bun run test:observability

      - name: Validate host metrics configuration
        run: bash script/check-alloy-config.sh
